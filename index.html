<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Experience · UniAnchieta</title>
    <meta
      name="description"
      content="Organização e acompanhamento dos processos reestruturados pelo setor de Customer Experience do UniAnchieta."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Pré-pintura do tema. Sem isto, o app pisca a paleta errada no primeiro render.
      A chave TEM de ser a mesma de src/config/app.ts (STORAGE_KEYS.tema). Se o
      prefixo de schema subir (cx.v2), esta linha sobe junto.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cx.v1.theme');
          // O store serializa em JSON — a entrada crua é '"dark"', com aspas.
          var theme = stored === 'dark' || stored === '"dark"' ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* storage indisponível — cai no claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
